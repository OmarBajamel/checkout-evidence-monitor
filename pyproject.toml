[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "checkout-evidence-monitor"
version = "0.2.0a1"
description = "Local, context-aware checkout evidence review with synthetic research and a bounded public pilot"
requires-python = ">=3.12,<3.13"
license = "MIT"
readme = "README.public.md"
authors = [{name = "Omar Ba Jamel"}]
keywords = ["checkout", "evidence", "playwright", "local-first", "research"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.12"]
dependencies = [
  "playwright==1.63.0", "fastapi==0.141.1", "pydantic==2.13.5",
  "uvicorn==0.53.0", "typer==0.27.2", "PyYAML==6.0.3", "Jinja2==3.1.6"
]

[project.urls]
Repository = "https://github.com/OmarBajamel/checkout-evidence-monitor"
Documentation = "https://github.com/OmarBajamel/checkout-evidence-monitor/blob/main/docs/README.md"
Issues = "https://github.com/OmarBajamel/checkout-evidence-monitor/issues"
Changelog = "https://github.com/OmarBajamel/checkout-evidence-monitor/blob/main/CHANGELOG.md"

[project.scripts]
cem = "cem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cem"]

[tool.hatch.build.targets.wheel.force-include]
"licenses" = "cem/licenses"
"THIRD_PARTY_NOTICES.md" = "cem/THIRD_PARTY_NOTICES.md"
"NOTICE" = "cem/NOTICE"

[tool.hatch.build.targets.sdist]
include = ["src/cem", "pyproject.toml", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "DEPENDENCIES.json", "licenses", "README.public.md", "requirements*.lock", "frontend/src", "frontend/public", "frontend/package*.json", "frontend/tsconfig.json", "frontend/vite.config.ts", "frontend/index.html", "frontend/.npmrc", "frontend/.storybook", "lab", "schemas", "migrations", "tools", "tests", "benchmarks", "examples"]
exclude = ["/reports/", "/state/", "/research/", "/publication/", "/content/", "/.cem-private/", "/.cem-data/", "/.cem-demo/", "/.build-tools/", "/.venv/", "/.agents/", "/.c*/", "/frontend/node_modules/"]

[tool.hatch.build.targets.sdist.force-include]
"README.md" = "README.md"
"README.ar.md" = "README.ar.md"
"README.de.md" = "README.de.md"
"docs/README.md" = "docs/README.md"
"docs/GETTING_STARTED.md" = "docs/GETTING_STARTED.md"
"docs/ROADMAP.md" = "docs/ROADMAP.md"
"docs/UPGRADING.md" = "docs/UPGRADING.md"
"docs/DESIGN.md" = "docs/DESIGN.md"
"docs/ar" = "docs/ar"
"docs/de" = "docs/de"
"docs/releases" = "docs/releases"
"docs/decisions/002_bounded_pilot.md" = "docs/decisions/002_bounded_pilot.md"
"docs/CURRENT_STATUS.md" = "docs/CURRENT_STATUS.md"
"docs/PILOT_QUICKSTART.md" = "docs/PILOT_QUICKSTART.md"
"docs/PILOT_SECURITY.md" = "docs/PILOT_SECURITY.md"
"docs/EVALUATION_V1_1.md" = "docs/EVALUATION_V1_1.md"
"docs/EVALUATION_RESULTS.md" = "docs/EVALUATION_RESULTS.md"
"docs/SIGNAL_IMPLEMENTATION.md" = "docs/SIGNAL_IMPLEMENTATION.md"
"assets" = "assets"
"SECURITY.md" = "SECURITY.md"
"CONTRIBUTING.md" = "CONTRIBUTING.md"
"CHANGELOG.md" = "CHANGELOG.md"
"docs/ACCEPTANCE.md" = "docs/ACCEPTANCE.md"
"docs/ARCHITECTURE.md" = "docs/ARCHITECTURE.md"
"docs/THREAT_MODEL.md" = "docs/THREAT_MODEL.md"
"docs/LIMITATIONS.md" = "docs/LIMITATIONS.md"
"docs/RUNBOOK.md" = "docs/RUNBOOK.md"
"docs/TESTING_STATUS.md" = "docs/TESTING_STATUS.md"
"docs/RESEARCH_DESIGN.md" = "docs/RESEARCH_DESIGN.md"
"docs/OBSERVATIONS.md" = "docs/OBSERVATIONS.md"
"docs/ATTRIBUTION.md" = "docs/ATTRIBUTION.md"
"docs/DESIGN_TOOLING.md" = "docs/DESIGN_TOOLING.md"
"docs/ACCESSIBILITY.md" = "docs/ACCESSIBILITY.md"
"docs/VISUAL_TEST_PLAN.md" = "docs/VISUAL_TEST_PLAN.md"
"docs/decisions/001_scope_and_integrity.md" = "docs/decisions/001_scope_and_integrity.md"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
